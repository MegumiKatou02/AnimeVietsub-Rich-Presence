<!DOCTYPE html>
<html>
  <head>
    <title>Presence Extension</title>
    <script src="popup.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="logo"><i class="fa-solid fa-circle-nodes"></i></div>
    <h1>Discord Rich Presence</h1>
    <div class="desc">Hiển thị trạng thái hoạt động của bạn trên Discord.<br>Bật/tắt bất cứ lúc nào!</div>
    <div id="info">Loading...</div>
    <div class="toggle-row">
      <label class="switch">
        <input type="checkbox" id="toggle-rich-presence">
        <span class="slider"></span>
      </label>
      <span id="toggle-label">Rich Presence</span>
    </div>
  </body>
</html>
